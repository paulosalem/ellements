name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Require a matching tag on master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}.")
          PY

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
          python -m pip install build twine

      - name: Run tests
        env:
          JUPYTER_PLATFORM_DIRS: "1"
        run: pytest -q -m "not requires_network"

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: |
          mypy \
            ellements-core/src \
            ellements-domain-specific/src \
            ellements-execution/src \
            ellements-agents/src \
            ellements-benchmarking/src \
            ellements-cli/src \
            ellements-fslm/src \
            ellements-reporting/src \
            ellements-standard-tools/src

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: twine check --strict dist/*

      - name: Verify wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/ellements-wheel"
          "$RUNNER_TEMP/ellements-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/ellements-wheel/bin/pip" check
          "$RUNNER_TEMP/ellements-wheel/bin/python" -c \
            "import ellements; assert ellements.__version__ == '${GITHUB_REF_NAME#v}'"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ellements
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifacts/

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release-artifacts/* \
              --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" \
              release-artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "Ellements ${GITHUB_REF_NAME#v}"
          fi
