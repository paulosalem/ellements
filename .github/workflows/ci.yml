name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.11 release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JUPYTER_PLATFORM_DIRS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
          python -m pip install build twine

      - name: Run tests
        run: pytest -q -m "not requires_network"

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: |
          mypy \
            ellements-core/src \
            ellements-domain-specific/src \
            ellements-execution/src \
            ellements-agents/src \
            ellements-benchmarking/src \
            ellements-cli/src \
            ellements-fslm/src \
            ellements-reporting/src \
            ellements-standard-tools/src

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Verify wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/ellements-wheel"
          "$RUNNER_TEMP/ellements-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/ellements-wheel/bin/python" -c \
            "import ellements; assert ellements.__version__ == '0.2.1'"
